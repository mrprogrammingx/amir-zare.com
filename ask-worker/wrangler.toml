name = "ask-about-amir"
main = "src/index.js"
compatibility_date = "2026-11-01"
# Only serve on amir-zare.com/api/ask (no public workers.dev or preview URLs).
workers_dev = false
preview_urls = false

# Serve the API on your own domain: https://amir-zare.com/api/ask
# (amir-zare.com must be on Cloudflare with the orange-cloud proxy on, which it is.)
routes = [
  { pattern = "amir-zare.com/api/ask", zone_name = "amir-zare.com" }
]

# Workers AI: no API key needed; the binding gives the Worker access to the models.
[ai]
binding = "AI"

[vars]
KB_URL = "https://amir-zare.com/kb.json"
ALLOWED_ORIGINS = "https://amir-zare.com,https://www.amir-zare.com,https://amirzaredev-ask-about-amir.static.hf.space"
MODELS = "@cf/meta/llama-3.3-70b-instruct-fp8-fast,@cf/zai-org/glm-4.7-flash"

# Per-visitor limit (Workers rate limiting binding): 6 questions a minute per IP. It is counted per Cloudflare
# location, so it is not a global limit: also add the WAF rate-limiting rule described in README.md.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 6, period = 60 }
